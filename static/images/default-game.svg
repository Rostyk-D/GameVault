<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2838"/>
      <stop offset="100%" stop-color="#0f141b"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66c0f4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12"
                    flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="900" rx="36" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="80" cy="120" r="90" fill="#66c0f4" opacity="0.08"/>
  <circle cx="520" cy="760" r="120" fill="#66c0f4" opacity="0.06"/>

  <!-- Controller -->
  <g transform="translate(300 330)" filter="url(#shadow)">
    <path d="
      M-120 -40
      C-155 -40 -175 -15 -185 30
      L-205 110
      C-215 150 -190 185 -150 185
      C-115 185 -95 165 -70 145
      C-35 118 35 118 70 145
      C95 165 115 185 150 185
      C190 185 215 150 205 110
      L185 30
      C175 -15 155 -40 120 -40
      Z"
      fill="#2d3748"/>

    <!-- D-pad -->
    <rect x="-115" y="28" width="18" height="70" rx="4" fill="#cbd5e1"/>
    <rect x="-141" y="54" width="70" height="18" rx="4" fill="#cbd5e1"/>

    <!-- Buttons -->
    <circle cx="105" cy="40" r="11" fill="#ef4444"/>
    <circle cx="130" cy="65" r="11" fill="#22c55e"/>
    <circle cx="80" cy="65" r="11" fill="#eab308"/>
    <circle cx="105" cy="90" r="11" fill="#3b82f6"/>

    <!-- Sticks -->
    <circle cx="-40" cy="110" r="22" fill="#4b5563"/>
    <circle cx="40" cy="110" r="22" fill="#4b5563"/>

    <circle cx="-40" cy="110" r="9" fill="#9ca3af"/>
    <circle cx="40" cy="110" r="9" fill="#9ca3af"/>
  </g>

  <!-- Title -->
  <text x="300"
        y="620"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="42"
        font-weight="700"
        fill="#f8fafc">
    NO GAME COVER
  </text>

  <text x="300"
        y="665"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="22"
        fill="#94a3b8">
    GameVault
  </text>

  <!-- Accent line -->
  <rect x="170"
        y="710"
        width="260"
        height="8"
        rx="4"
        fill="url(#accent)"/>

  <!-- Bottom icon -->
  <circle cx="300" cy="790" r="28"
          fill="none"
          stroke="#66c0f4"
          stroke-width="4"/>

  <path d="M300 775 L300 805 M285 790 L315 790"
        stroke="#66c0f4"
        stroke-width="4"
        stroke-linecap="round"/>
</svg>
