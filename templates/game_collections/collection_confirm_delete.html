{% extends "base/base.html" %}

{% block title %}
  Delete Collection
{% endblock %}

{% block content %}
  <h1>Delete Collection</h1>

  <p>
    Are you sure you want to delete your Collection: {{ gamecollection }}? This action cannot be undone.
  </p>

  <form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
      Delete Collection
    </button>

    <a href="{% url "game_collections:detail" user.pk %}" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
